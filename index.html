<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix the Computer Until It Explodes!!!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menu Screen -->
    <div id="menu-container">
        <img id="logo" src="assets/logo.png" alt="Menu Logo">
        <button class="button" onclick="startGame()">Play</button>
        <button class="button" onclick="showLaptopSelection()">Laptop Selection</button>
        <button class="button" onclick="showCreation()">Creation (Coming Soon)</button>
        <button class="button" onclick="showSettings()">Settings</button>
    </div>

    <!-- Game Screen -->
    <div id="game-container">
        <div id="timer-shelf">
            <div id="progress-bar"></div>
        </div>
        <img id="laptop" src="assets/laptop-1.webp" alt="Laptop">
        <div id="message">Click to fix the laptop!</div>
        <div class="controls">
            <button class="button" id="pauseButton">Pause</button>
            <button class="button" onclick="backToMenu()">Back to Menu</button>
        </div>
    </div>

    <!-- Settings Screen -->
    <div id="settings-container">
        <h2>Settings</h2>
        <label for="language">Select Language:</label>
        <select id="language" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="pl">Polski</option>
        </select>
        <br><br>
        <button class="button" onclick="backToMenu()">Back to Menu</button>
    </div>

    <!-- Laptop Selection Screen -->
    <div id="laptop-selection-container">
        <!-- Content generated by JS -->
    </div>

    <!-- Creation Screen -->
    <div id="creation-container">
        <h2>Creation Mode</h2>
        <p>Coming Soon!!!</p>
        <button class="button" onclick="backToMenu()">Back to Menu</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
